---
# Multi-version rollup specification
# Used by rollup-starter-ansible to build multiple rollup versions for hard fork support

rollup_versions:
  - version_id: "v0"
    ansible_commit: "theodore/external-build-rollup-role"
    vars_file: "version_vars/v0_vars.yaml"
    start_height: null
    stop_height: 100
    migration_path: null

  - version_id: "v1"
    ansible_commit: "theodore/external-build-rollup-role"
    vars_file: "version_vars/v1_vars.yaml"
    start_height: 101
    stop_height: null
    migration_path: null
