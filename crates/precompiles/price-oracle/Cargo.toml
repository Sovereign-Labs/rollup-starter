[package]
description = "Relay price oracle EVM precompile for the Relay Chain"
edition = { workspace = true }
license = { workspace = true }
name = "price-oracle"
publish = false
repository = { workspace = true }
rust-version = { workspace = true }
version = "1.0.0"

[dependencies]
alloy-primitives = { workspace = true, features = ["borsh"] }
borsh = { workspace = true }
bytes = { workspace = true }
sov-evm = { workspace = true }
sov-modules-api = { workspace = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
sov-evm = { workspace = true, features = ["native"] }
sov-modules-api = { workspace = true, features = ["native"] }
sov-rollup-interface = { workspace = true }
sov-test-utils = { workspace = true }

[features]
default = []
native = ["sov-evm/native", "sov-modules-api/native", "dep:tracing"]
